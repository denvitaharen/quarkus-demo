name: Java CI with Maven

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-temperature:
    name: Build Temperature
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Build Temperature with Maven
        working-directory: temperature
        run: mvn -B package --file pom.xml

  build-engine-heater:
    name: Build Engine Heater
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Build Engine Heater with Maven
        working-directory: engine-heater
        run: mvn -B package --file pom.xml